name: Sync-pipeline


on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: build & deploy docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "icoop.live"
          username: root
          password: "${{ secrets.ICOOP_UBUNTU_PASSWORD }}"
          script: |
            cd /root/containers/face-crop-api
            git pull
            docker compose up -d --build
