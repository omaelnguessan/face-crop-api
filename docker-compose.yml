services:
  face-crop-api:
    build: .
    image: face-crop-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      ALLOWED_HOSTS: openinary.icoop.live
      MAX_DIMENSION: "2000"
      MAX_BYTES: "12582912"
      SCORE_THRESHOLD: "0.75"
      NMS_THRESHOLD: "0.3"
      DEFAULT_ZOOM: "2.6"
      WORKERS: "4"
      CACHE_TTL: "604800"
      OMP_NUM_THREADS: "2"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
